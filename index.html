<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞雪 - 投稿</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f7f8fa;color:#222;max-width:700px;margin:3rem auto;padding:0 16px}
h1{text-align:center;margin-bottom:2rem;color:#333}
form{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #00000012}
.item{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-weight:500}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px}
textarea{min-height:160px;resize:vertical}
button{width:100%;padding:12px;background:#4466ff;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
button:hover{background:#3355ee}
.tip{margin-top:16px;text-align:center;color:#666;font-size:14px}
#msg{margin-top:12px;text-align:center}
</style>
</head>
<body>
<h1>飞雪投稿</h1>
<form id="submitForm">
  <div class="item">
    <label>昵称</label>
    <input name="name" required>
  </div>
  <div class="item">
    <label>联系方式（选填）</label>
    <input name="contact">
  </div>
  <div class="item">
    <label>正文</label>
    <textarea name="content" required></textarea>
  </div>
  <button type="submit">提交投稿</button>
  <div id="msg"></div>
</form>
<div class="tip"><a href="/admin.html">后台审核入口</a></div>

<script>
const form = document.getElementById('submitForm');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const msg = document.getElementById('msg');
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  try{
    const res = await fetch('/api/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    })
    const r = await res.json();
    if(r.ok){
      msg.innerText="✅ 提交成功，等待管理员审核";
      form.reset();
    }else{
      msg.innerText="❌ "+r.msg;
    }
  }catch(err){
    msg.innerText="❌ 网络错误";
  }
})
</script>
</body>
</html>
